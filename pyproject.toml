[project]
name = "portunix-tooling"
version = "0.0.0"
description = "Python tooling for the Portunix repository (scripts and integration tests). Not a published package."
requires-python = ">=3.14"

[tool.uv]
# Use only uv-managed Python interpreters; never probe the system PATH.
# On Windows this avoids the Microsoft Store "app execution alias"
# (WindowsApps\python3.exe) stub, which hangs uv's interpreter probe.
python-preference = "only-managed"

[dependency-groups]
test = [
    "pytest>=7.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-mock>=3.6.0",
    "pytest-html>=3.1.0",
    "requests>=2.28.0",
    "paramiko>=2.9.0",
    "pexpect>=4.8.0",
    "colorama>=0.4.4",
]
