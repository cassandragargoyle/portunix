archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{- tolower .Os }}_{{ .Arch }}"
    # Windows -> .zip, ostatní -> .tar.gz
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    wrap_in_directory: false
    builds:
      - portunix
      - ptx-container
      - ptx-mcp
      - ptx-virt
      - ptx-ansible
      - ptx-make
      - ptx-aiops
      - ptx-pft
      - ptx-prompting
      - ptx-credential
      - ptx-python
      - ptx-installer
      - ptx-trace
      - ptx-ssh
      - ptx-plugin-registry
      - ptx-proxmox
      - ptx-specpm
      - ptx-database
      - ptx-github
      - ptx-wizard
    files:
      - src: scripts/install.sh
        dst: install.sh
      - src: scripts/install.ps1
        dst: install.ps1
      - src: scripts/install.bat
        dst: install.bat
      - LICENSE*
      - README.md
      # Optionally add e.g. shell completion:
      # - "completions/*"
 
dist: dist

checksum:
  name_template: "checksums_{{ .Version }}.txt"
  algorithm: sha256

release:
  github:
    owner: cassandragargoyle
    name: portunix
  
  # Create individual checksum files for each binary
  # Include quickstart scripts for easy onboarding
  extra_files:
    - glob: ./dist/*
    - glob: ./release-assets/quickstart/*.ps1
    - glob: ./release-assets/quickstart/*.sh
    - glob: ./scripts/install.ps1
    - glob: ./scripts/install.bat
  
  # Release notes
  header: |
    ## Portunix {{.Version}}

    Unified AI plugin and task platform for development environments, with Git-like dispatcher architecture.

    **This release includes:**
    - Main portunix binary (dispatcher)
    - ptx-container helper (Docker/Podman management)
    - ptx-mcp helper (MCP server functionality)
    - ptx-virt helper (Virtualization management)
    - ptx-ansible helper (Infrastructure as Code with Ansible)
    - ptx-make helper (Cross-platform Makefile utilities)
    - ptx-aiops helper (AI/ML operations with Ollama)
    - ptx-pft helper (Product Feedback Tool)
    - ptx-prompting helper (Prompt templates management)
    - ptx-credential helper (Secure credential storage)
    - ptx-python helper (Python environment management)
    - ptx-installer helper (Package installation engine)
    - ptx-trace helper (Universal tracing system for software development)
    - ptx-ssh helper (Unified SSH client with non-interactive password auth)
    - ptx-plugin-registry helper (Plugin platform-capability gRPC daemon for Synapse/Pack/Agent integration)
    - ptx-proxmox helper (Remote Proxmox VE management — phase 1: authentication)
    - ptx-specpm helper (spec-kit-pm project-management scaffolding — Issue #183 / ADR-040)
    - ptx-database helper (database engine management — Issue #013, Phase 1: PostgreSQL + SQLite)
    - ptx-github helper (GitHub repositories, releases, and authentication — Issue #025)
    - ptx-wizard helper (Interactive YAML-based CLI installation wizards — Issue #014)

  footer: |
    ## Installation

    Download and extract the appropriate archive for your platform, then run the installation script.
    The archive contains all necessary binaries (portunix, ptx-container, ptx-mcp, ptx-virt, ptx-ansible, ptx-make, ptx-aiops, ptx-pft, ptx-prompting, ptx-credential, ptx-python, ptx-installer, ptx-trace, ptx-ssh, ptx-plugin-registry, ptx-proxmox, ptx-specpm, ptx-database, ptx-github, ptx-wizard).

    ### Linux/macOS
    ```bash
    # Download and extract
    tar -xzf portunix_{{.Version}}_linux_amd64.tar.gz
    cd portunix_{{.Version}}_linux_amd64

    # Interactive installation
    ./install.sh

    # Or silent installation
    ./install.sh --silent --add-to-path
    ```

    ### Windows (one-liner)
    ```powershell
    irm https://github.com/cassandragargoyle/portunix/releases/latest/download/install.ps1 | iex
    ```

    ### Windows (manual)
    ```powershell
    # Download and extract
    Expand-Archive portunix_{{.Version}}_windows_amd64.zip
    cd portunix_{{.Version}}_windows_amd64

    # Double-click install.bat or run:
    .\install.ps1

    # Or silent installation
    .\install.ps1 -Silent -AddToPath
    ```

    ## Architecture Notes

    Starting with this version, Portunix uses a Git-like dispatcher architecture:
    - **portunix**: Main dispatcher that routes commands to helper binaries
    - **ptx-container**: Handles container, docker, and podman commands
    - **ptx-mcp**: Handles MCP server operations
    - **ptx-virt**: Handles virtualization and VM management
    - **ptx-ansible**: Handles Infrastructure as Code with Ansible integration

    All binaries are installed together and work seamlessly. The user interface remains unchanged.

    ## QuickStart Scripts

    Get started quickly with pre-configured environments:
    ```powershell
    # Docusaurus documentation site (Windows)
    irm https://github.com/cassandragargoyle/portunix/releases/latest/download/quickstart-docusaurus.ps1 | iex
    ```

    ## Self-Update

    Once installed, you can update Portunix using:
    ```bash
    portunix update
    ```

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'