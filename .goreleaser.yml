# .goreleaser.yml
# GoReleaser configuration for Portunix with helper binaries

project_name: portunix

# Do not include commit hash in snapshot name (no -60b7fbf)
snapshot:
  name_template: "{{ incpatch .Version }}-snapshot"

# before hooks disabled - go mod tidy removes manually added dependencies
# before:
#   hooks:
#     - go mod tidy

builds:
  # Build configurations:
  # - Single file helpers: Use main: ./src/helpers/xxx/main.go
  # - Multi-file helpers with shared module: Use main: ./ + dir: ./src/helpers/xxx/
  # - Multi-file helpers with separate module: Use main: ./ + dir: ./src/helpers/xxx/

  # Main portunix binary
  - id: portunix
    binary: portunix
    main: ./main.go
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: arm64
    ldflags:
      - -X main.version={{ .Version }}
      - -X portunix.ai/app/update.Version={{ .Version }}
      - -X portunix.ai/app/version.ProductVersion={{ .Version }}
      # Issue #165: embed Ed25519 update-signing pubkey if PORTUNIX_UPDATE_PUBKEY
      # is exported (make-release.py reads assets/update-signing-pubkey.txt and
      # exports it). Empty value disables verification (backward compatible).
      - -X portunix.ai/app/update.PublicKeyHex={{ with index .Env "PORTUNIX_UPDATE_PUBKEY" }}{{ . }}{{ end }}
      - -s -w
    env:
      - CGO_ENABLED=0

