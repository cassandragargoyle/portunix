[package]
name = "my-rust-plugin"
version = "1.0.0"
edition = "2021"
description = "Example Rust plugin for Portunix"
license = "MIT"

[lib]
name = "my_rust_plugin"
path = "src/lib.rs"

[[bin]]
name = "plugin"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.37", features = ["full"] }
tonic = "0.11"
tonic-health = "0.11"
prost = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }

[build-dependencies]
tonic-build = "0.11"

[dev-dependencies]
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }
